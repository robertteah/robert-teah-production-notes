name: Deploy (OIDC, no stored credentials)

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::ACCOUNT_ID:role/github-actions-deploy-role
          aws-region: us-east-1

      - name: Trivy scan (hard gate — fails the build on fixable CRITICAL/HIGH CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ github.repository }}:${{ github.sha }}"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Deploy
        run: |
          aws sts get-caller-identity   # confirms the assumed role, no static keys anywhere in this run
          # helm upgrade / kubectl apply / etc. goes here
